# RK3588 真机 YOLO 感知进程模板
# 说明：
# - 本进程仅支持 RKNN FP16 模型，通过 RK3588 NPU 推理。
# - bool 值只能使用 true / false，不要加引号。
# - 相对路径均以本文件所在目录 config/ 为基准。

# -----------------------------------------------------------------------------
# RKNN 模型
# -----------------------------------------------------------------------------
# 仓库内随代码管理的 RKNN FP16 部署模型。
model_path: "../data/models/cuadc-fp16.rknn"

# 每个 worker 使用一个独立 RKNN context，并依次固定到 NPU core；结果按
# frame_id 顺序进入 tracker。暂保留 2 个 worker，USB 实测后再调优。
# 范围 1..3，设为 1 可回退到同步推理路径。
inference_workers: 2

# 模型类别名称，顺序必须与 RKNN 模型输出一致。
class_names: ["bucket", "H"]

# 检测置信度阈值与 NMS IOU 阈值，范围通常为 0.0 到 1.0。
conf_thres: 0.30
iou_thres: 0.45

# 该模型只有 bucket (0) 和 H (1) 两类；保留全部模型输出。
classes: [0, 1]

# -----------------------------------------------------------------------------
# 视频输入
# -----------------------------------------------------------------------------
# 可选形式：
# - 本地摄像头：/dev/videoX 或 /dev/v4l/by-id/<device>
# - UDP H264/RTP：端口号字符串，例如 "5600"
# - RTSP、本地视频文件或完整 GStreamer pipeline
# 已通过 uvcvideo/V4L2 确认的视频采集节点；避免 /dev/video41 编号变化。
source: "/dev/video41"

# 本地摄像头采集参数。
camera_width: 640
camera_height: 480
camera_fps: 30
camera_fourcc: "MJPG"

# true：只处理最新帧，减少推理显示积压造成的延迟。
latest_frame: true

# -----------------------------------------------------------------------------
# Virtual Nadir Camera V1（实机近似参数，待标定验证）
# -----------------------------------------------------------------------------
# 用户确认：2.8 mm 镜头、85° 对角视场角、正常下视安装方向。
# 按 640×480、方形像素和针孔模型近似换算；不等同于实机标定。
# 假设 85° 对应当前 4:3 采集画面，若驱动裁切需重新测量。
virtual_nadir:
  # 唯一的图像路径开关：
  # false = raw frame -> YOLO -> Web UI
  # true  = IMU stabilized frame -> YOLO -> Web UI
  # 启用后只接受已同步且频率合格的姿态；姿态失配时暂停感知，避免将错误
  # 的增稳画面用于定位或控制。
  enabled: true
  yaw_reference_mode: "lock_on_start"
  # 只影响本机 OpenCV 调试窗口，不改变 Web UI 的 YOLO 标注画面。
  debug_compare: false

  attitude:
    ip: "127.0.0.1"
    port: 5011
    # active：接受 telemetry runtime 当前 active source，并在切换时清空历史。
    source: "active"
    history_ms: 1500
    max_samples: 128
    max_sample_distance_ms: 75
    max_bracket_span_ms: 150
    # 30 Hz 理论周期约 33 ms；等待至 75 ms 以覆盖调度/UDP 抖动。这里只等
    # 下一条真实样本用于 SLERP，不进行姿态外推。
    future_wait_ms: 75
    # telemetry 配置请求 80 Hz；低于 25 Hz 时感知链 fail closed，避免低频姿态硬套图像。
    min_rate_hz: 25
    rate_window_ms: 1000
    min_rate_samples: 4

  camera:
    width: 640
    height: 480
    fx: null
    fy: null
    cx: null
    cy: null
    fov_x_deg: 72.487673
    fov_y_deg: 57.603876
    distortion: [0, 0, 0, 0, 0]
    # Camera → Body FRD：camera +X→body +Y，+Y→body -X，+Z→body +Z。
    r_body_camera:
      - [0, -1, 0]
      - [1, 0, 0]
      - [0, 0, 1]
    approximate_calibration: true

  output:
    width: 640
    height: 480
    fx: null
    fy: null
    cx: null
    cy: null
    fov_x_deg: 72.487673
    fov_y_deg: 57.603876
    border_value: [0, 0, 0]

# -----------------------------------------------------------------------------
# 目标选择与锁定
# -----------------------------------------------------------------------------
# 自动选择主目标策略，可选值：center / biggest / class。
selection_mode: "class"

# selection_mode=class 时优先选择的类别名。
target_class: "bucket"

# 锁定目标连续丢失多少帧后自动解锁。
max_lost_frames: 5

# -----------------------------------------------------------------------------
# UDP 数据输出与目标控制命令
# -----------------------------------------------------------------------------
# 向 app 发布当前目标与场景检测结果。
udp_ip: "127.0.0.1"
udp_port: 5005
max_datagram_bytes: 60000
max_detections: 128

# true：接收 Web UI 或终端 UI 发出的目标切换、锁定、解锁命令。
command_enabled: true
command_ip: "127.0.0.1"
command_port: 5006

# -----------------------------------------------------------------------------
# 画面标注、显示与录像
# -----------------------------------------------------------------------------
# 普通目标框线宽；锁定目标会额外加粗。
line_width: 5

# true：绘制所有可见 tracks；false：只显示主要目标。
show_all_tracks: true

# 兼容旧版本地显示开关。display.local_window_enabled 存在时以新配置为准。
show: false
window_name: "YOLO Tracking"

# 本地窗口和网页视频流可以独立启用。
display:
  local_window_enabled: false
  fullscreen: false

web_stream:
  enabled: true
  host: "0.0.0.0"
  port: 8081
  # 弱 WiFi 推荐 480x360 / quality 35 / max_fps 20。
  # 极低带宽推荐 320x240 / quality 25 / max_fps 20。
  # width <= 0 或 height <= 0 表示保持原图输出，不影响 YOLO 推理输入。
  jpeg_quality: 30
  max_fps: 20
  width: 480
  height: 360

# true：保存带标注的视频。生成文件属于运行产物，不提交 Git。
save_video: false
save_path: "../runtime/videos/track_output.mp4"

# Web UI 原始摄像头录制目录。录制写入未标注的实际读取帧。
recording_dir: "../runtime/videos"
